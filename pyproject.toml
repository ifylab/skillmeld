[project]
name = "skillmeld"
version = "0.4.0"
description = "Discover existing community skills and merge the best into one tailored, security-scanned skill set."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hossein Zargar" }]
keywords = ["claude", "agent-skills", "skills", "compose", "merge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "bandit>=1.8",
    "cryptography>=43",
    "httpx>=0.27",
    "license-expression>=30",
    "markdown-it-py>=3",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://ifylab.dev/tools/skillmeld"
Repository = "https://github.com/ifylab/skillmeld"
Changelog = "https://github.com/ifylab/skillmeld/blob/main/CHANGELOG.md"
Issues = "https://github.com/ifylab/skillmeld/issues"

[project.scripts]
skillmeld = "skillmeld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/skillmeld", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]
exclude = ["**/.impeccable", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/skillmeld"]
exclude = ["**/.impeccable", "**/__pycache__"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pytest>=8",
    "pytest-cov>=5",
    "types-pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["skillmeld"]
branch = true

[tool.ty.environment]
python-version = "3.12"
